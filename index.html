<html lang="en">
  <head>

    <title>Family Budget</title>
    <meta name="description" content="Track household spending, budgets and bills for the whole family." />

    <!-- Installable web app. theme-color tints the Android status bar, and is

    <meta name="theme-color" content="#1B1410" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Budget" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
