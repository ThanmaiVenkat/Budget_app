name: Firebase Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [claude/app-dev-continuation-zsyjc0]
    paths:
      - '.github/workflows/firebase-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    name: Deploy rules + print web app config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write service account credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy Firestore security rules
        run: firebase deploy --only firestore:rules --project budget-7a420 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json

      - name: Print web app SDK config
        # These values are not sensitive (Firebase's own docs: access control
        # is the security rules just deployed above, not hiding this config)
        # — safe to print in a log so they can be copied into the app's
        # remaining repository secrets (VITE_FIREBASE_*).
        run: |
          firebase apps:list WEB --project budget-7a420 --json > "$RUNNER_TEMP/apps.json"
          APP_ID=$(node -e "console.log(require('$RUNNER_TEMP/apps.json').result[0].appId)")
          echo "App ID: $APP_ID"
          firebase apps:sdkconfig WEB "$APP_ID" --project budget-7a420
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/apps.json"
